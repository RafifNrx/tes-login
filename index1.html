<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FORM PESAN</title>
    <style>
        .teks-merah{
            color:red;

        .teks-biru{
            color: #69cfff;
            font-family: cursive;
            font-weight: bold;
        }   

        #ib{
            color: beige;
        }
        input,select,textarea{
            background-color: #69cfff;
            border: 2px solid;
            border-radius: 25px;

        }
        input[type="date"]{

            border: 2px solid cyan;

        }

        .btn{

            background-color: #94ddff   ;
            border: 2px solid #69cfff ;
            border-radius: 25px;
        }

        .btn:hover{
            color: #94ddff;
            background-color: #d6f2ff   ;
            border: 2px solid #69cfff ;
            border-radius: 25px;
        }

    </style>
</head>
<body>
    <table border="0" width="%" style="border-collapse: collapse; border-color: black; border-style: solid; background-color: white;
        align-content: left;">
        <tbody>
            <form action="">
            <tr>
                <td class="teks-biru">Name</td>
                <td class="teks-biru">:</td>

            </tr>

            <tr>
                <td class="teks-biru">Email</td>
                <td class="teks-biru">:</td>

            </tr>

            <tr>

                <td class="teks-biru">:</td>

            </tr>

            <tr>
                <td></td>

            </tr>

            </form>
        </tbody>
    </table>
</body>
</html>
